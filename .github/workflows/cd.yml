name: cd

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/388644783731/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@notely-osman.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --async \
            --tag us-central1-docker.pkg.dev/notely-osman/notely-ar-repo/my-image:latest \
            .
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/notely-osman/notely-ar-repo/my-image@sha256:aa810097d0835937eabb8eb5b023309dd200cd684f5cc9c9e5198305ecc12635 \
            --region us-central1 \
            --allow-unauthenticated \
            --project notely-osman \
            --max-instances=4